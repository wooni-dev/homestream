name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build exe
        run: python -m PyInstaller stream_server.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream_server-windows
          path: dist/stream_server.exe

  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build app
        run: python -m PyInstaller stream_server.spec

      - name: Zip app bundle
        run: cd dist && zip -r HomeStream-macOS.zip HomeStream.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream_server-macos
          path: dist/HomeStream-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: stream_server-windows
          path: artifacts/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: stream_server-macos
          path: artifacts/macos

      - name: Upload versioned release to R2
        run: |
          TAG=${{ github.ref_name }}
          aws s3 cp artifacts/windows/stream_server.exe \
            s3://$R2_BUCKET/releases/$TAG/stream_server.exe \
            --endpoint-url $R2_ENDPOINT
          aws s3 cp artifacts/macos/HomeStream-macOS.zip \
            s3://$R2_BUCKET/releases/$TAG/HomeStream-macOS.zip \
            --endpoint-url $R2_ENDPOINT

      - name: Update latest to R2
        run: |
          aws s3 cp artifacts/windows/stream_server.exe \
            s3://$R2_BUCKET/releases/latest/stream_server.exe \
            --endpoint-url $R2_ENDPOINT
          aws s3 cp artifacts/macos/HomeStream-macOS.zip \
            s3://$R2_BUCKET/releases/latest/HomeStream-macOS.zip \
            --endpoint-url $R2_ENDPOINT
