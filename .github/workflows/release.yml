name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build exe
        run: python -m PyInstaller stream_server.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream_server-windows
          path: dist/stream_server.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build app
        run: python -m PyInstaller stream_server.spec

      - name: Zip app bundle
        run: cd dist && zip -r HomeStream-macOS.zip HomeStream.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream_server-macos
          path: dist/HomeStream-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: stream_server-windows
          path: artifacts/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: stream_server-macos
          path: artifacts/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/stream_server.exe
            artifacts/macos/HomeStream-macOS.zip
          generate_release_notes: true
