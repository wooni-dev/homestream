name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build executable
        run: dotnet publish HomeStream.csproj -r win-x64 --self-contained -p:PublishSingleFile=true -p:Configuration=Release -o dist

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} dist/HomeStream.exe --title "${{ github.ref_name }}" --generate-notes

      - name: Trigger homestream-web rebuild
        run: curl -X POST "${{ secrets.HOMESTREAM_WEB_DEPLOY_HOOK }}"
