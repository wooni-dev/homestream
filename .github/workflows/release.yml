name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows executable
        run: dotnet publish Windows/HomeStream.Windows.csproj -r win-x64 --self-contained -p:PublishSingleFile=true -p:Configuration=Release -o dist/win-x64

      - name: Build macOS executables
        run: |
          dotnet publish Mac/HomeStream.Mac.csproj -r osx-arm64 --self-contained -p:PublishSingleFile=true -p:Configuration=Release -o dist/osx-arm64
          dotnet publish Mac/HomeStream.Mac.csproj -r osx-x64 --self-contained -p:PublishSingleFile=true -p:Configuration=Release -o dist/osx-x64

      - name: Package macOS archives
        shell: pwsh
        run: |
          Compress-Archive -Path dist/osx-arm64/* -DestinationPath dist/HomeStream-macos-arm64.zip
          Compress-Archive -Path dist/osx-x64/* -DestinationPath dist/HomeStream-macos-x64.zip

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} dist/win-x64/HomeStream.exe dist/HomeStream-macos-arm64.zip dist/HomeStream-macos-x64.zip --title "${{ github.ref_name }}" --generate-notes

      - name: Trigger homestream-web rebuild
        run: curl -X POST "${{ secrets.HOMESTREAM_WEB_DEPLOY_HOOK }}"
